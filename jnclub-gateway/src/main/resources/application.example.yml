server:
  port: 19005

spring:
  application:
    name: jnclub
  datasource:
    url: jdbc:mysql://localhost:3306/jnclub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_db_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 分片上传：单分片大小由 jnclub.disk.chunk-size-mb 控制（默认 2MB），
  # max-file-size/max-request-size 需大于单个分片，按上限 10MB 预留余量
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

sa-token:
  sso:
    mode: client
    server-url: http://localhost:8080
    client-url: http://localhost:19005
    client-id: app-jnclub
    secret-key: your_sso_secret_key
  token-name: jn-token
  # 会话超时与 SSO 服务端保持一致(604800 = 7 天),避免两端登出/过期不同步
  timeout: 604800

jnclub:
  frontend-url: http://localhost:5173
  # Sa-Token 会话持久化 DAO 的加密密钥：生产必须用环境变量 JNCLUB_DAO_CRYPTO_KEY 覆盖
  sa-token-dao:
    crypto-key: ${JNCLUB_DAO_CRYPTO_KEY:change-me-in-production}
  # 跨域白名单：仅列出的来源允许跨域访问（同源部署无需配置）。
  # 本地 Vite dev 走代理属同源，浏览器扩展由 host_permissions 覆盖，均不需要额外来源。
  # 2026-10-26：代码已自动将 jnclub.frontend-url 的域名解析后加入白名单，
  # 生产环境只需正确配置 frontend-url 即可，无需再单独维护 cors.allowed-origins。
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  dufs:
    base-url: http://jn_file.88933.vip
    public-url: http://jn_file.88933.vip
    upload-path: /jnclub/images/
    disk-path: /jnclub/disk/
    username: your_dufs_user
    password: your_dufs_password
  upload:
    max-size-mb: 10
  disk:
    # 单文件大小上限与分片大小（小带宽/不稳定网络下取较小分片，失败重传成本低）
    max-size-mb: 500
    chunk-size-mb: 2
    # 分片暂存的本地临时目录，默认 <系统临时目录>/jnclub-upload，可覆盖
    # temp-dir: /path/to/jnclub-upload

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.jnclub: debug
