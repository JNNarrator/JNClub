# 音乐模块配置（并入 JNClub 单体）
# 说明：数据源复用 JNClub 主数据源（jnclub 库，music_ 前缀表）；端口/context-path 由单体统一（19005）。
# 生产环境如需覆盖，请在 jnclub-gateway 的外置 application.yml 中追加同名配置。

# 文件服务（dufs）：内部地址给后端访问，公开地址返回给客户端
# 注意：jnmusic.file-server.* 目前无任何 Java 消费方（FileServerProperties 已无引用），
# 原此处遗留的 username/password 已删除，避免真实凭据入库。若后续启用请从外置配置注入。

# Spring Cache + Caffeine 直链缓存（45 分钟过期，见 CacheConfig）
spring.cache.type=caffeine

# 蓝奏云客户端：账号密码用于 Cookie 过期时自动续期登录
# 真实凭据不入库，键留空即可（缺省时从下面任一处注入）：
#   · 本地 → 未跟踪的 jnclub-gateway/src/main/resources/application.yml
#   · 线上 → /home/jiangnan/JNClub/jnclub-gateway/application.yml（由 --spring.config.location 指定）
#   · 或环境变量 LANZOU_CLIENT_USERNAME / LANZOU_CLIENT_PASSWORD
