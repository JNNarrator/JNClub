server:
  port: 19005

spring:
  application:
    name: jnclub
  datasource:
    url: jdbc:mysql://localhost:3306/jnclub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: jiangnan123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

sa-token:
  sso:
    mode: client
    server-url: http://localhost:8080/sso
    client-url: http://localhost:19005
    client-id: app-jnclub
    secret-key: jn-sso-secret-key-2026
  token-name: jn-token
  # 会话超时与 SSO 服务端保持一致(604800 = 7 天),避免两端登出/过期不同步
  timeout: 604800

jnclub:
  frontend-url: http://localhost:5173/jnclub/
  dufs:
    base-url: http://localhost:8000
    public-url: /api/files/jnclub/images/
    upload-path: /jnclub/images/
    username:
    password:
  upload:
    max-size-mb: 10

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.jnclub: debug
