server:
  port: 19005

spring:
  application:
    name: jnclub
  datasource:
    url: jdbc:mysql://localhost:3306/jnclub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: jiangnan123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 分片上传：单分片大小由 jnclub.disk.chunk-size-mb 控制（默认 2MB），
  # max-file-size/max-request-size 需大于单个分片，按上限 10MB 预留余量
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

sa-token:
  sso:
    mode: client
    server-url: http://localhost:8080/sso
    client-url: http://localhost:19005
    client-id: app-jnclub
    secret-key: jn-sso-secret-key-2026
  token-name: jn-token
  # 会话超时与 SSO 服务端保持一致(604800 = 7 天),避免两端登出/过期不同步
  timeout: 604800

# Sa-Token 会话持久化 DAO 的加密密钥（生产环境务必通过环境变量 JNCLUB_DAO_CRYPTO_KEY 覆盖）
jnclub:
  sa-token-dao:
    crypto-key: ${JNCLUB_DAO_CRYPTO_KEY:jnclub-dev-crypto-key-change-me}
  frontend-url: http://localhost:5173/jnclub/
  dufs:
    base-url: http://localhost:8000
    public-url: /api/files/jnclub/images/
    upload-path: /jnclub/images/
    disk-path: /jnclub/disk/
    username:
    password:
  upload:
    max-size-mb: 10
  disk:
    # 单文件大小上限与分片大小（小带宽/不稳定网络下取较小分片，失败重传成本低）
    max-size-mb: 500
    chunk-size-mb: 2
    # 分片暂存的本地临时目录，默认 <系统临时目录>/jnclub-upload，可覆盖
    # temp-dir: /path/to/jnclub-upload

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.jnclub: debug
