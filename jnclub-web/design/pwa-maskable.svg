    <path d="M200 101.78l-1.12-1.02C81.08 76.43 50.77 59.45 50.77 35.77 50.77 19.55 61.86 10 73.46 10c9.03 0 18.01 3.7 23.46 9.3C102.38 13.7 111.35 10 120.39 10 131.98 10 143.08 19.55 143.08 35.77c0 23.68-30.31 40.66-80.42 65L61.54 101.78z" fill="#FFFFFF"/>
