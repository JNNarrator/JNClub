<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- JNClub maskable 图标：背景铺满（系统自行裁切），heart 收进 80% 安全区 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC5B8E"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D43F6A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D43F6A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- heart 底部阴影（200 尺寸，居中） -->
  <g transform="translate(156 162)">
