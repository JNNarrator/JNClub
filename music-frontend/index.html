<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100c11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>JNMusic · 夜猫电台</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首帧主题预判（PLAN-2026-19 M3-1）：内嵌时主站用 ?theme= 传入当前明暗，
      // 独立访问（直链/PWA）时回落到本地偏好。必须早于样式生效，
      // 否则亮色用户冷启动会先看到暗底、再闪一下（此前 index.html 写死暗色所致）。
      (function () {
        var mode = 'dark';
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'light' || q === 'dark') {
            mode = q;
          } else {
            var saved = localStorage.getItem('jn.theme');
            if (saved === 'light' || saved === 'dark') mode = saved;
          }
        } catch (e) {
          /* 隐私模式等取不到 localStorage：保持默认暗色 */
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.style.colorScheme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'dark' ? '#100c11' : '#f4ecd8');
      })();
    </script>
    <style>
      :root {
        /* 兜底：脚本未执行（禁用 JS）时仍按暗色渲染 */
        color-scheme: dark;
      }
      html, body, #app {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
      html {
        touch-action: manipulation;
      }
      body {
        font-family: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: #100c11;
        color: #f6ecdc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      /* styles.css 尚未加载时的亮色首屏底色，避免暗底闪烁 */
      html[data-theme='light'] body {
        background: #f4ecd8;
        color: #241b16;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
